name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:cli
      - run: npm run size
      - run: npm run docs

  coverage:
    name: coverage floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run coverage

  # The development tools need Node 22, but the published package must run on older runtimes, so
  # these jobs build once on Node 24 and then run the built package through a plain runner.
  runtimes:
    name: built package on ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [node18, node20, deno, bun]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - if: matrix.runtime == 'node18'
        uses: actions/setup-node@v7
        with:
          node-version: 18
      - if: matrix.runtime == 'node20'
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
      - if: startsWith(matrix.runtime, 'node')
        run: |
          node --version
          node smoke/run.mjs
          echo '{ a [ 1 2 ] }' | node dist/cli.mjs to-json
      - if: matrix.runtime == 'deno'
        run: deno run -A smoke/run.mjs
      - if: matrix.runtime == 'bun'
        run: bun smoke/run.mjs

  # The same checks in real browsers (smoke/browser.mjs): the package loaded as an ES module,
  # the suite read over HTTP from a loopback server.
  browsers:
    name: built package in ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node smoke/browser.mjs ${{ matrix.browser }}
