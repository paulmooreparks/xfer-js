name: release

on:
  push:
    branches: [main, master]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest && npm --version
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:cli
      # Opens or updates the version pull request; when that is merged, publishes with provenance
      # under npm's trusted publishing (no long-lived token). Prereleases use changesets `pre` mode.
      - uses: changesets/action@v2
        with:
          version-script: npx changeset version
          publish-script: npx changeset publish
          pr-title: "Version packages"
          commit-message: "Version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
